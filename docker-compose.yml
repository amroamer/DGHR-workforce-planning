services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dghr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dghr}
      POSTGRES_DB: ${POSTGRES_DB:-dghr}
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dghr} -d ${POSTGRES_DB:-dghr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dghr}:${POSTGRES_PASSWORD:-dghr}@postgres:5432/${POSTGRES_DB:-dghr}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5183}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEMO_AI_MODE: ${DEMO_AI_MODE:-fallback}
      MODEL_NAME: ${MODEL_NAME:-claude-sonnet-5}
      # Destructive-reset guard. false = a reseed / POST /api/demo/reset REFUSES to wipe a populated
      # DB (first-run seeding of an empty DB still works). Set true ONLY for a deliberate demo reset.
      ALLOW_DB_RESET: ${ALLOW_DB_RESET:-false}
    ports:
      - "8010:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else sys.exit(1)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8010}
    ports:
      - "5183:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  uploads:
