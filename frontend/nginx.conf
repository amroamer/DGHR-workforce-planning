# Static file server for the built SPA. Internal only (port 80), fronted by Caddy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable -> cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves index.html so React Router deep links work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
